        - agent-researcher
        - deep-research
        - literature-search
        - citation-management
        - github-research
        - searxng-search
        - interactive-html-research-report
        - kanban-subtask-orchestration
        - project-doc-artifacts
        - mermaid-diagram
        - angular-developer
      always:
        - kanban-card-workflow
        - kanban-subtask-orchestration
        - project-doc-artifacts
      rules:
        - when:
            keywords_any:
