    classifier_keywords_en: [bug fix, bug, fix issue]
    stages: [research_phase, implement_backend_bugfix, integration_synthesis_phase, docs_sync_phase, hitl_ship_gate, release_phase]
    terminal: false

    task_skills:
      by_profile:
        backend-unit-test-writer:
