# ---------------------------------------------------------------------------
# PATHS — pre-declared common shapes. Each path = ordered list of stage
# template references. Orchestrator picks a path based on classifier output.
# Adding a new path is YAML editing, not code.
# ---------------------------------------------------------------------------
paths:

  # ===== Full pipelines (multi-stage) =====

  feature_backend:
    description: "Full backend feature — research+arch+plan → backend+judges → synthesis → docs → ship → release."
    classifier_keywords_hu: [új feature backend, backend feature, szerver oldali, új API, új endpoint, REST, middleware, rate limit]
    classifier_keywords_en: [feature, backend feature, new API, new endpoint, REST API, server-side feature, rate limit, rate limiting, middleware, endpoint]
    stages:
      - research_phase
      - architecture_phase
      - api_contract_phase
      - plan_consensus
      - hitl_plan_gate
      - implement_backend
      - integration_synthesis_phase
      - docs_sync_phase
      - hitl_ship_gate
      - release_phase
    terminal: false

  feature_frontend:
    description: "Full frontend feature — research+arch+UX+plan → frontend+judges → synthesis → docs → ship → release."
    classifier_keywords_hu: [új UI, frontend feature, kliens oldali, új oldal, új komponens UI-val]
    classifier_keywords_en: [feature frontend, new UI feature, new page, new screen, UI component, new view]
    stages:
      - research_phase
      - architecture_phase
      - ux_phase
      - api_contract_phase
      - plan_consensus_with_ux_and_api
      - hitl_plan_gate
      - implement_frontend
      - integration_synthesis_phase
      - docs_sync_phase
      - hitl_ship_gate
      - release_phase
    terminal: false

  feature_fullstack:
    description: "Full-stack feature touching backend + frontend. Shared-worktree write stages are serialized, then synthesized before one release."
    classifier_keywords_hu: [full stack, teljes funkció, backend és frontend]
    classifier_keywords_en: [full-stack, full stack feature, end-to-end feature]
    stages:
      - research_phase
      - architecture_phase
      - ux_phase
      - api_contract_phase
      - plan_consensus_with_ux_and_api
      - hitl_plan_gate
      - implement_backend
      - implement_frontend_after_backend
      - integration_synthesis_phase
      - docs_sync_phase
      - hitl_ship_gate
      - release_phase
    terminal: false

  feature_data:
    description: "Data engineering feature — schema/migration/ETL with judges + release."
    classifier_keywords_hu: [új tábla, séma változás, migráció, ETL, adatfolyamat]
    classifier_keywords_en: [schema change, migration, ETL, data pipeline, new table, dbt model]
    stages: [research_phase, architecture_phase, plan_consensus, hitl_plan_gate, implement_data, integration_synthesis_phase, docs_sync_phase, hitl_ship_gate, release_phase]
    terminal: false

  feature_prompt:
    description: "Prompt engineering production change with eval + code review."
    classifier_keywords_hu: [új prompt produkciós, agent prompt változtatás, LLM eval]
    classifier_keywords_en: [prompt update, agent loop change, LLM behaviour change, tool schema]
    stages: [research_phase, architecture_phase, plan_consensus, hitl_plan_gate, implement_prompt, integration_synthesis_phase, docs_sync_phase, hitl_ship_gate, release_phase]
    terminal: false

  # ===== Planning-only / Discovery paths =====

  plan_only:
    description: "Discovery + plan-consensus + HITL approval. No build, no ship. Output: PLAN.md + ADR."
    classifier_keywords_hu: [tervezz meg, plan only, csak terv, dokumentáld a tervet, gondold ki]
    classifier_keywords_en: [plan only, design only, draft plan, plan the approach]
    stages: [research_phase, architecture_phase, plan_consensus, hitl_plan_gate]
    terminal: true

  research_only:
    description: "Just a research dossier. No HITL gate needed (informational output)."
    classifier_keywords_hu: [csak kutatás, kutass, kutatás, derítsd ki, vizsgáld meg, állapítsd meg, kutatási, versenytárs]
    classifier_keywords_en: [research only, research, find out, look up, investigate, competitive landscape, evaluate options, survey]
    stages: [research_only]
    terminal: true

  architecture_only:
    description: "ADR or system design without planning. Terminal at gate."
    classifier_keywords_hu: [ADR, csak architektúra, design dokumentum, csak modulokat]
    classifier_keywords_en: [ADR only, architecture decision, system design doc, design document]
    stages: [research_phase, architecture_phase, hitl_plan_gate]
    terminal: true

  ux_design_only:
    description: "UX design / wireframes / prototype with no implementation."
    classifier_keywords_hu: [UX terv, wireframe, mockup, prototípus, design tokens, design system]
    classifier_keywords_en: [UX design, wireframe, mockup, prototype, design tokens, design system]
    stages: [research_phase, ux_phase, hitl_plan_gate]
    terminal: true

  # ===== Narrow operational paths =====

  hotfix:
    description: "Skip Round A, but require a dedicated failing regression test before the urgent fix, then judges + release."
    classifier_keywords_hu: [hotfix, gyors javítás, kritikus bug, prod crash, P0, urgent]
