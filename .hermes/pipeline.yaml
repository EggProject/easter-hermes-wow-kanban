# ---------------------------------------------------------------------------
# STAGE TEMPLATES — reusable composable building blocks. A path is a
# sequence of stage_template references with role bindings.
# ---------------------------------------------------------------------------
stage_templates:

  research_phase:
    description: "Round A — Discovery phase. Single dossier."
    steps:
      - {profile: researcher, parent: "<intake-id>"}

    task_skills:
      by_profile:
        researcher:
          - agent-researcher
  architecture_phase:
    description: "Round A — Architecture phase. ADR + system design."
    steps:
      - {profile: architect, parent: "research_phase.last"}

    task_skills:
      by_profile:
        architect:
          - architecture
          - system-design
  ux_phase:
    description: "Round A optional — UX design phase after the shared research dossier."
    steps:
      - {profile: ux-designer, parent: "research_phase.last"}

    task_skills:
      by_profile:
        ux-designer:
          - design-brief
  api_contract_phase:
    description: Round A — API contract phase. Owns OpenAPI/schema/mock contract artifacts before planning.
    steps:
      - profile: api-designer
        parent: architecture_phase.last
    task_skills:
      by_profile:
        api-designer:
          - api-and-interface-design
          - project-doc-artifacts
          - mermaid-diagram
          - openapi-spec-generation
  plan_consensus:
    description: "Round A — Plan + Reflexion loop (max 3 iterations)."
    steps:
      - {profile: planner, parent: "architecture_phase.last"}
      - {profile: plan-reviewer, parent: "planner.last", reflexion: true}

    task_skills:
      by_profile:
        planner:
          - plan
        plan-reviewer:
          - omh-ralplan
  plan_consensus_with_ux:
    description: "Round A — Plan consumes both ratified architecture and UX output, then Reflexion review."
    steps:
      - {profile: planner, parent: ["architecture_phase.last", "ux_phase.last"]}
      - {profile: plan-reviewer, parent: "planner.last", reflexion: true}

    task_skills:
      by_profile:
        planner:
          - plan
        plan-reviewer:
          - omh-ralplan
  plan_consensus_with_ux_and_api:
    description: Round A — Plan consumes architecture, API contract, and UX output, then Reflexion review.
    steps:
      - profile: planner
        parent:
          - architecture_phase.last
          - api_contract_phase.last
          - ux_phase.last
      - profile: plan-reviewer
        parent: planner.last
        reflexion: true
    task_skills:
      by_profile:
        planner:
          - plan
          - project-doc-artifacts
          - mermaid-diagram
        plan-reviewer:
          - omh-ralplan
  hitl_plan_gate:
    description: "Round A → B HITL gate — user approves PLAN.md."
    kanban_block:
      reason: "review-required: approve plan (Round A complete, awaiting user)"

  implement_backend:
    description: "Round B — Backend TDD: unit Red → API/contract Red → implementation Green/Refactor → full judge chain."
    task_metadata:
      tdd_required: true
      tdd_mode: red-green-refactor
      test_writer_chain: backend-unit-test-writer -> backend-api-test-writer
    steps:
      - {profile: backend-unit-test-writer, parent: "hitl_plan_gate.last"}
      - {profile: backend-api-test-writer, parent: "backend-unit-test-writer.last"}
      - {profile: backend-coder, parent: "backend-api-test-writer.last"}
      - {profile: code-reviewer, parent: "backend-coder.last"}
      - {profile: security-auditor, parent: "code-reviewer.last"}
      - {profile: qa-e2e-tester, parent: "security-auditor.last"}

    task_skills:
      by_profile:
        backend-unit-test-writer:
          - test-driven-development
          - kanban-subtask-orchestration
        backend-api-test-writer:
          - test-driven-development
          - api-testing
          - kanban-subtask-orchestration
        backend-coder:
          - test-driven-development
          - kanban-subtask-orchestration
        code-reviewer:
          - code-review-and-quality
        security-auditor:
          - threat-modeling
  implement_frontend:
    description: "Round B — Frontend TDD/ATDD: unit/component Red → acceptance/E2E Red → implementation Green/Refactor → full judge chain."
    task_metadata:
      tdd_required: true
      tdd_mode: red-green-refactor-plus-acceptance-red
