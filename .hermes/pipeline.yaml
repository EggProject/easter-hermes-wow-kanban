    classifier_keywords_hu: [biztonsági audit, security review, sec audit, CVE elemzés]
    classifier_keywords_en: [security audit, security review, threat model, CVE assessment]
    stages: [security_audit_only, hitl_ship_gate]
    terminal: true

  perf_optimization:
    description: "Performance optimization — research baseline + coder + judges + e2e on running stack."
    classifier_keywords_hu: [teljesítmény, optimalizáció, perf, lassú, gyorsítsd]
    classifier_keywords_en: [performance, optimization, perf, slow, speed up, latency]
    stages: [research_phase, plan_consensus, hitl_plan_gate, implement_backend, integration_synthesis_phase, docs_sync_phase, hitl_ship_gate, release_phase]
    terminal: false

    task_skills:
      by_profile:
        frontend-coder:
